    <script>
        let user = {
            name: "John",
            age: 30,
            address: { // Nested object means object inside an object
                city: "New York",
                zip: "10001",
                hobbies : {
                    hobby1: "Reading",
                    hobby2: "Traveling",
                    hobby3: "Cooking"
                }

        };

        console.log(user.address); // Accessing top-level property
        console.log(user.address.hobbies.hobby1); // Accessing top-level property
    </script>
