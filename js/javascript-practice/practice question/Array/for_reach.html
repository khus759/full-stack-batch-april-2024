<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for_each_task</title>
</head>
<body>
    <h1>for_each_task</h1>
</body>
<script>
    //Print each number in an array.
    const numbers = [1,2,3,4,5,5,6,7,8,8];
    numbers.forEach((number) => {
        console.log(number);
    });

    //Print "Hello, [name]" for each name.
    const names = ['riya','sita','priya','sneha'];
    names.forEach((name)=>{
        console.log(`Hello ${name}`);
    })
</script>
</html>
